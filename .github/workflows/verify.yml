name: Verify and publish Habit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio decoder
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Verify every Ryan clip and complete content coverage
        run: python tools/audio.py --check
      - name: Check application JavaScript
        run: |
          node --check app.js
          node --check engine.js
          node --check sw.js
      - name: Verify learning and review behaviour
        run: node --test tools/test-engine.mjs
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html styles.css app.js engine.js content.json sw.js manifest.webmanifest _site/
          cp -R assets audio _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
